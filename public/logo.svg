<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ArcheryMotion logo. Full-bleed artwork; tools/make-icons.mjs derives the rounded and maskable variants. -->
  <defs><clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a52"/>
      <stop offset="1" stop-color="#0a1c22"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- bow limbs, centred on the grip at (0, 0) -->
    <path id="limbs" d="M-44 -150 Q30 -90 14 0 Q30 90 -44 150" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <g clip-path="url(#tile)"><rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.85) translate(-256 -256)">
    <!-- the bow's movement around the grip: earlier positions -->
    <g transform="translate(372 232)" stroke="#3ee08f" fill="none">
      <use href="#limbs" transform="rotate(14)" stroke-opacity="0.16"/>
      <use href="#limbs" transform="rotate(7)" stroke-opacity="0.34"/>
    </g>
    <g filter="url(#drop)" stroke="#f3efe6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- string, drawn to the anchor -->
      <path d="M328 82 L218 197 L328 382" stroke-width="4" stroke-opacity="0.85"/>
      <!-- legs -->
      <path d="M186 330 L150 452 M186 330 L226 452" stroke-width="30"/>
      <!-- body -->
      <path d="M196 214 L186 330" stroke-width="50"/>
      <!-- bow arm to the grip -->
      <path d="M204 216 L368 232" stroke-width="22"/>
      <!-- draw arm: elbow behind, hand at the anchor -->
      <path d="M190 218 L112 178 L210 198" stroke-width="20"/>
      <circle cx="214" cy="198" r="14" fill="#f3efe6" stroke="none"/>
      <!-- head -->
      <circle cx="206" cy="152" r="32" fill="#f3efe6" stroke="none"/>
      <!-- bow -->
      <use href="#limbs" transform="translate(372 232)"/>
      <!-- arrow -->
      <path d="M218 196 L448 196" stroke-width="7"/>
      <path d="M474 196 L442 180 L442 212 Z" fill="#f3efe6" stroke="none"/>
      <path d="M262 196 L292 196 L280 180 L250 180 Z M262 196 L292 196 L280 212 L250 212 Z" fill="#e5463d" stroke="none"/>
      <!-- sensor on the grip -->
      <rect x="370" y="218" width="36" height="46" rx="9" fill="#f7c843" stroke="#0f1c26" stroke-width="4"/>
    </g>
  </g>
  <rect width="512" height="512" fill="url(#shine)"/>
</g></svg>

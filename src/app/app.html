<header class="topbar">
  <img class="logo" src="icons/favicon.svg" alt="ArcheryMotion" width="28" height="28" />
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Optag</a>
    <a routerLink="/skytter" routerLinkActive="active">Skytter</a>
    <a routerLink="/optagelser" routerLinkActive="active">Optagelser</a>
    <a routerLink="/ble" routerLinkActive="active">BLE</a>
  </nav>
  <button class="theme" (click)="toggleTheme()" [attr.aria-label]="light() ? 'Mørkt tema' : 'Lyst tema til udendørs'">
    {{ light() ? '🌙' : '☀️' }}
  </button>
</header>
<main>
  <router-outlet />
</main>

<div class="head">
  <span class="title">{{ title() }} <span class="unit">({{ unit() }})</span></span>
  <span class="legend">
    @for (s of series(); track s.name) {
      <span class="key"><i [style.background]="s.color"></i>{{ s.name }}</span>
    }
  </span>
</div>

<svg
  [attr.width]="width()"
  [attr.height]="height"
  (pointermove)="onMove($event)"
  (pointerdown)="onDown($event)"
  (pointerleave)="hover.set(undefined)"
>
  <!-- phase bands -->
  @for (b of visibleBands(); track b.start) {
    <rect class="band" [attr.x]="b.x" [attr.y]="m.top" [attr.width]="b.w" [attr.height]="height - m.top - m.bottom" [attr.fill]="b.color" />
    @if (b.showLabel) {
      <text class="band-label" [attr.x]="b.x + 4" [attr.y]="height - m.bottom - 4">{{ b.label }}</text>
    }
  }

  <!-- grid + y axis -->
  @for (v of yTicks(); track v) {
    <line class="grid" [attr.x1]="m.left" [attr.x2]="width() - m.right" [attr.y1]="y(v)" [attr.y2]="y(v)" />
    <text class="tick" [attr.x]="m.left - 6" [attr.y]="y(v) + 4" text-anchor="end">{{ v | number: '1.0-2' }}</text>
  }
  @for (t of xTicks(); track t) {
    <text class="tick" [attr.x]="x(t)" [attr.y]="height - 6" text-anchor="middle">{{ t | number: '1.0-2' }} s</text>
  }

  <!-- release marker -->
  @if (domain()[0] <= 0 && domain()[1] >= 0) {
    <line class="release" [attr.x1]="x(0)" [attr.x2]="x(0)" [attr.y1]="m.top" [attr.y2]="height - m.bottom" />
    <text class="tick" [attr.x]="x(0) + 4" [attr.y]="m.top + 10">slip</text>
  }

  @for (p of paths(); track $index) {
    <path [attr.d]="p.d" [attr.stroke]="p.color" class="series" />
  }

  @for (l of endLabels(); track l.name) {
    <text class="end-label" [attr.x]="width() - m.right + 6" [attr.y]="l.y + 4">{{ l.name }}</text>
  }

  <!-- playback cursor -->
  @if (cursor() >= domain()[0] && cursor() <= domain()[1]) {
    <line class="cursor" [attr.x1]="x(cursor())" [attr.x2]="x(cursor())" [attr.y1]="m.top" [attr.y2]="height - m.bottom" />
  }

  @if (hoverInfo(); as h) {
    <line class="crosshair" [attr.x1]="h.x" [attr.x2]="h.x" [attr.y1]="m.top" [attr.y2]="height - m.bottom" />
  }
</svg>

@if (hoverInfo(); as h) {
  <div class="tooltip" [style.left.px]="h.x" [class.flip]="h.x > width() / 2">
    <div class="tt-time">{{ h.t | number: '1.3-3' }} s</div>
    @for (r of h.rows; track r.name) {
      <div class="tt-row">
        <i [style.background]="r.color"></i>
        <span>{{ r.name }}</span>
        <strong>{{ r.value === undefined ? '–' : (r.value | number: '1.1-1') }}</strong>
      </div>
    }
  </div>
}
